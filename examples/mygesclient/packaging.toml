# MyGesClient (Wails app). Put the prebuilt binary at the repo root, then:
#   python3 -m packagingonlinux build -c examples/mygesclient/packaging.toml

[app]
id = "io.github.spatulox.MyGesClient"
name = "MyGesClient"
version = "1.0.0"
summary = "MyGes native desktop client"
description = "Unofficial desktop client for the MyGes student portal."
license = "GPL-3.0-only"
maintainer = "Spatulox"
categories = ["Education"]

[linux]
binary = "../../MyGesClient"
icon = "../../icons/appicon.png"

[deps]
# Detected automatically for deb (dpkg-shlibdeps) and rpm (AutoReq).
auto = true

[output]
formats = ["deb", "rpm", "tarball"]
dir = "../../builds"
