# Reusable workflow: builds the packages described by a project's packaging.toml and
# uploads them as artifacts. Made to be the build step of a release-kit release
# (https://github.com/Spatulox/release-kit): the artifact names start with "release-", so
# release-kit attaches the packages to the GitHub release.
#
#   jobs:
#     packages:
#       uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@v0
#       with:
#         version: ${{ inputs.debversion }}   # 1.2.0~beta, from release-kit's tag.yml
#
# packaging.toml is the only description of the build: the [linux] / [windows] command
# (which may call a script of the project) runs first, then every format is built.
# The toolchain that command needs (compilers, SDKs, -dev libraries...), whatever the
# language, comes from the project's build image: `dockerfile` (built here, cached) or
# `image`. The packaging tools are added on top of it, and the whole build runs in it.
# Without either, the build runs on the Ubuntu runner itself.
# What has to be built on another OS (a Windows .exe made on a Windows runner...) comes
# from artifacts of earlier jobs, with `download`.
#
# Jobs: "packages" builds every format but snap on one runner (the build command runs once);
# "snap" builds the snap as root on the Ubuntu release of [snap] base (not with a build image).
name: PackagingOnLinux

on:
  workflow_call:
    inputs:
      config:
        description: Path of packaging.toml in the repository (or in the downloaded artifacts).
        type: string
        default: packaging.toml
      formats:
        description: Comma-separated formats to build. Empty = [output] formats of the config.
        type: string
        default: ""
      version:
        description: Version of the packages, replacing [app] version (e.g. release-kit's debversion). Empty = the config's.
        type: string
        default: ""
      artifact-name:
        description: Name of the uploaded artifact; the snap goes in "<name>-snap".
        type: string
        default: release-packages
      download:
        description: Artifacts of earlier jobs to download before building (name or glob). A .tar at their top is extracted (artifacts lose the executable bit).
        type: string
        default: ""
      download-path:
        description: Where to download them, relative to the repository.
        type: string
        default: .
      dockerfile:
        description: Dockerfile of the build environment, in the repository (built with the repository root as context). Its base must have apt-get or dnf.
        type: string
        default: ""
      build-args:
        description: Build arguments of the dockerfile, one NAME=value per line (e.g. BASE=ubuntu:26.04 for a matrix over distribution releases).
        type: string
        default: ""
      image:
        description: Public image of the build environment (e.g. ubuntu:26.04, fedora:latest), instead of a dockerfile. It must have apt-get or dnf.
        type: string
        default: ""
      runs-on:
        description: Runner of the "packages" job (the snap job uses the Ubuntu release of [snap] base).
        type: string
        default: ubuntu-24.04
      packagingonlinux-ref:
        description: PackagingOnLinux version (git ref) to build with.
        type: string
        default: v0
    outputs:
      version:
        description: Version of the built packages.
        value: ${{ jobs.plan.outputs.version }}

permissions:
  contents: read

env:
  CONFIG: ${{ inputs.config }}
  CONTAINER: ${{ inputs.dockerfile != '' || inputs.image != '' }}
  # Not hidden: upload-artifact skips hidden files.
  OUT: packagingonlinux-dist

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      formats: ${{ steps.plan.outputs.formats }}
      apt: ${{ steps.plan.outputs.apt }}
      dnf: ${{ steps.plan.outputs.dnf }}
      snap: ${{ steps.plan.outputs.snap }}
      snap-runner: ${{ steps.plan.outputs.snap-runner }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Spatulox/PackagingOnLinux
          ref: ${{ inputs.packagingonlinux-ref }}
          path: .packagingonlinux
      - uses: ./.packagingonlinux/ci/github/setup
        with:
          download: ${{ inputs.download }}
          download-path: ${{ inputs.download-path }}
      - id: plan
        env:
          FORMATS: ${{ inputs.formats }}
          VERSION: ${{ inputs.version }}
          BOTH: ${{ inputs.dockerfile != '' && inputs.image != '' }}
        run: |
          if [ "$BOTH" = true ]; then
            echo "::error::Set dockerfile or image, not both"
            exit 1
          fi
          python .packagingonlinux/ci/github/plan.py "$CONFIG" "$FORMATS" "$VERSION" "$CONTAINER" > plan.txt
          cat plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"

  packages:
    needs: plan
    if: needs.plan.outputs.formats != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Spatulox/PackagingOnLinux
          ref: ${{ inputs.packagingonlinux-ref }}
          path: .packagingonlinux
      - uses: ./.packagingonlinux/ci/github/setup
        with:
          download: ${{ inputs.download }}
          download-path: ${{ inputs.download-path }}

      # --- On the runner ---
      - name: Packaging tools
        if: env.CONTAINER != 'true'
        env:
          APT: ${{ needs.plan.outputs.apt }}
        run: sh .packagingonlinux/ci/github/install-tools.sh "$APT" ""
      - name: Build ${{ needs.plan.outputs.formats }}
        if: env.CONTAINER != 'true'
        env:
          FORMATS: ${{ needs.plan.outputs.formats }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python -m packagingonlinux build -c "$CONFIG" -f "$FORMATS" --version "$VERSION" -o "$OUT"

      # --- In the project's build image ---
      # Not the current builder: `docker build` below must see the loaded image locally.
      - uses: docker/setup-buildx-action@v4
        id: buildx
        if: inputs.dockerfile != ''
        with:
          use: false
      # One cache per Dockerfile, build arguments and architecture.
      - name: Cache key of the image
        id: cache
        if: inputs.dockerfile != ''
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          key="$(printf '%s\n%s\n%s' "$DOCKERFILE" "$BUILD_ARGS" "$RUNNER_ARCH" | sha256sum | cut -c1-16)"
          echo "scope=packagingonlinux-$key" >> "$GITHUB_OUTPUT"
      - name: Build image ${{ inputs.dockerfile }}
        if: inputs.dockerfile != ''
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          tags: pol-user
          load: true
          cache-from: type=gha,scope=${{ steps.cache.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache.outputs.scope }}
      - name: Pull image ${{ inputs.image }}
        if: inputs.image != ''
        env:
          IMAGE: ${{ inputs.image }}
        run: docker pull "$IMAGE" && docker tag "$IMAGE" pol-user
      - name: Add the packaging tools to the image
        if: env.CONTAINER == 'true'
        env:
          APT: ${{ needs.plan.outputs.apt }}
          DNF: ${{ needs.plan.outputs.dnf }}
        run: |
          layer="$RUNNER_TEMP/packagingonlinux-tools"
          mkdir -p "$layer"
          cp .packagingonlinux/ci/github/install-tools.sh "$layer/"
          cat > "$layer/Dockerfile" <<'EOF'
          FROM pol-user
          USER root
          ARG APT
          ARG DNF
          COPY install-tools.sh /tmp/install-tools.sh
          RUN CHECK_PYTHON=1 sh /tmp/install-tools.sh "$APT" "$DNF" && rm /tmp/install-tools.sh
          EOF
          docker build --build-arg APT --build-arg DNF -t pol-build "$layer"
      # The repository is mounted at the same path, so that PYTHONPATH (.packagingonlinux)
      # and the downloaded files stay valid. --privileged: flatpak-builder needs bwrap.
      # safe.directory: the build command may use git on the repository (owned by the runner).
      - name: Build ${{ needs.plan.outputs.formats }} in the image
        if: env.CONTAINER == 'true'
        env:
          FORMATS: ${{ needs.plan.outputs.formats }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: >
          docker run --rm --privileged
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE"
          -e PYTHONPATH -e CI -e GITHUB_ACTIONS
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          --entrypoint python3 pol-build
          -m packagingonlinux build -c "$CONFIG" -f "$FORMATS" --version "$VERSION" -o "$OUT"
      - name: Give the files created in the image back to the runner user
        if: always() && env.CONTAINER == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Summary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -l "$OUT"
          {
            echo "### Packages $VERSION"
            echo
            for f in "$OUT"/*; do echo "- \`${f##*/}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.OUT }}/*
          if-no-files-found: error

  # snapcraft builds directly on the runner (SNAPCRAFT_BUILD_ENVIRONMENT=host), which must be
  # the Ubuntu release of the snap base, as root.
  snap:
    needs: plan
    if: needs.plan.outputs.snap == 'true'
    runs-on: ${{ needs.plan.outputs.snap-runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Spatulox/PackagingOnLinux
          ref: ${{ inputs.packagingonlinux-ref }}
          path: .packagingonlinux
      - uses: ./.packagingonlinux/ci/github/setup
        with:
          download: ${{ inputs.download }}
          download-path: ${{ inputs.download-path }}
      - run: sudo snap install snapcraft --classic
      - name: Build snap
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >
          sudo -E env "PATH=$PATH" SNAPCRAFT_BUILD_ENVIRONMENT=host
          python -m packagingonlinux build -c "$CONFIG" -f snap --version "$VERSION" -o "$OUT"
      - name: Summary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -l "$OUT"
          {
            echo "### Snap $VERSION"
            echo
            for f in "$OUT"/*; do echo "- \`${f##*/}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-snap
          path: ${{ env.OUT }}/*.snap
          if-no-files-found: error
