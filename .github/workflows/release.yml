# Pushing a tag vX.Y.Z tests the project, builds every package with version X.Y.Z
# (whatever packaging.toml says) and publishes them as the GitHub release vX.Y.Z:
# deb, rpm, tar.gz, Windows installer (setup.exe) and Windows portable zip.
# The release notes are the "## [X.Y.Z]" section of CHANGELOG.md. A tag whose version
# has no section there (or an empty one) fails at once: nothing is built or released.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Same rule as AppSpec.validate(): deb and rpm need a leading digit, rpm forbids "-".
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+~]*$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a valid version (expected vX.Y.Z, no '-')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            # The section starts at "## [X.Y.Z]", "## X.Y.Z" or "## vX.Y.Z" (an optional
            # " - date" may follow) and ends at the next "## " heading. Blank lines at the
            # start and end of the section are dropped.
            awk -v v="$VERSION" '
              /^## / {
                if (in_section) exit
                h = $0
                sub(/^## +/, "", h); sub(/^\[/, "", h); sub(/^v/, "", h); sub(/[] ].*$/, "", h)
                in_section = (h == v)
                next
              }
              in_section {
                lines[++n] = $0
                if ($0 ~ /[^[:space:]]/) { if (!first) first = n; last = n }
              }
              END { if (first) for (i = first; i <= last; i++) print lines[i] }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "::error::No entry for $VERSION in CHANGELOG.md: add a \"## [$VERSION]\" section to release it"
            exit 1
          fi
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 desktop-file-utils nsis
      - run: pip install -e '.[gui,test]'
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  # A Python + Qt app can't be frozen into an .exe from Linux: PyInstaller runs here and
  # the resulting folder ([windows] dir in packaging.toml) is packaged by the linux job.
  windows-app:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
      - name: Set the version from the tag
        run: sed -i 's/^__version__ = .*/__version__ = "${{ needs.version.outputs.version }}"/' packagingonlinux/__init__.py
      - name: Freeze with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name PackagingOnLinux
          --icon selfpack/packagingonlinux.ico --collect-submodules packagingonlinux --exclude-module PyQt6
          --workpath build/pyinstaller --distpath build/windows
          selfpack/windows/launcher.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: build/windows/
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: [version, test, windows-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - uses: actions/download-artifact@v8
        with:
          name: windows-app
          path: build/windows
      - name: Set the package version from the tag
        run: sed -i 's/^version = .*/version = "${{ needs.version.outputs.version }}"/' packaging.toml
      - run: python3 -m packagingonlinux build -f deb,tarball,zip,nsis -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux
          path: dist/*
          if-no-files-found: error

  rpm:
    needs: [version, test]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y rpm-build python3 findutils sed
      - uses: actions/checkout@v7
      - name: Set the package version from the tag
        run: sed -i 's/^version = .*/version = "${{ needs.version.outputs.version }}"/' packaging.toml
      - run: python3 -m packagingonlinux build -f rpm -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    needs: [version, linux, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - run: ls -l dist
      - run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "PackagingOnLinux ${{ needs.version.outputs.version }}"
          --notes-file notes/release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
