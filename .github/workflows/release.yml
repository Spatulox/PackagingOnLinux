# Pushing a tag vX.Y.Z_alpha, vX.Y.Z_beta, vX.Y.Z_rc, vX.Y.Z_release (or vX.Y.Z), with
# release-kit (https://github.com/Spatulox/release-kit):
#   1. tag: decodes the tag, and fails at once (nothing built) when CHANGELOG.md has no
#      section for it ("## [X.Y.Z]", "## vX.Y.Z"...),
#   2. build.yml: tests, then builds every package with version X.Y.Z (X.Y.Z~beta...),
#      whatever packaging.toml says,
#   3. publish: the GitHub release, with the CHANGELOG section as notes,
#   4. a stable release moves the v0 tag, which other repositories use to call
#      package.yml@v0.
# "Run workflow" in the Actions tab is a dry run: everything is built, nothing published.
name: Release

on:
  push:
    tags: ["v*.*.*"]   # not the moving v0 tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    uses: Spatulox/release-kit/.github/workflows/tag.yml@v1
    with:
      require-changelog: true

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      debversion: ${{ needs.tag.outputs.debversion }}

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.dry-run != 'true'
    uses: Spatulox/release-kit/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
      title: PackagingOnLinux ${{ needs.tag.outputs.tag }}
      require-changelog: true

  move-v0:
    needs: [tag, publish]
    if: needs.tag.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git tag -f v0 "$GITHUB_SHA"
          git push -f origin v0
