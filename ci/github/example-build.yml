# Example .github/workflows/build.yml of a project released with release-kit
# (https://github.com/Spatulox/release-kit) and packaged by PackagingOnLinux.
#
# The project's release.yml is release-kit's example, unchanged:
#   tag (release-kit) -> build (this file) -> publish (release-kit)
#
# Everything the packages need is in the project's packaging.toml: [linux] command
# (e.g. "bash scripts/build.sh") builds the app in the build image described by
# .github/build.Dockerfile (the project's toolchain: compilers, SDKs, -dev libraries), then
# every format of [output] formats is built and uploaded as "release-packages", which
# release-kit attaches to the GitHub release.
name: Build

on:
  workflow_call:
    inputs:
      debversion:   # 1.2.0~beta (1.2.0+dev.42.gabc1234 for a dry run)
        type: string
        required: true

jobs:
  packages:
    uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@v0
    with:
      version: ${{ inputs.debversion }}
      dockerfile: .github/build.Dockerfile   # or image: ubuntu:24.04
      # config: packaging.toml        # path of the config
      # formats: deb,rpm,appimage     # default: [output] formats of the config

  # One .deb per Ubuntu release and architecture: the image is given directly, or the
  # Dockerfile takes its base as an argument (ARG BASE=ubuntu:24.04 / FROM ${BASE}) and the
  # call passes `build-args: BASE=ubuntu:${{ matrix.ubuntu }}` with the dockerfile.
  #
  # debs:
  #   strategy:
  #     matrix:
  #       ubuntu: ["24.04", "26.04"]
  #       runner: [ubuntu-24.04, ubuntu-24.04-arm]
  #   uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@v0
  #   with:
  #     version: ${{ inputs.debversion }}+ubuntu${{ matrix.ubuntu }}
  #     image: ubuntu:${{ matrix.ubuntu }}
  #     runs-on: ${{ matrix.runner }}
  #     formats: deb
  #     artifact-name: release-deb-${{ matrix.ubuntu }}-${{ matrix.runner }}

  # When the Windows .exe must be built on Windows, build it in a job of its own and let
  # package.yml download it where [windows] binary / dir points:
  #
  # windows-app:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: ./scripts/build-windows.ps1          # -> build/windows/MyApp.exe
  #     - uses: actions/upload-artifact@v7
  #       with:
  #         name: windows-app
  #         path: build/windows/
