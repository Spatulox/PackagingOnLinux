# PackagingOnLinux packaging itself. From the repo root:
#   python3 -m packagingonlinux build
# The build command assembles build/app/ (the Python package + a launcher); it is
# installed to /usr/lib/packagingonlinux/ with /usr/bin/packagingonlinux pointing to
# bin/packagingonlinux (no arguments = GUI, otherwise CLI).

[app]
id = "io.github.spatulox.PackagingOnLinux"
name = "PackagingOnLinux"
version = "0.1.3"
summary = "Package any prebuilt app for every Linux format"
description = """
Describe an application once, pick the formats, and get deb, rpm, tar.gz
and more packages. Works on any distribution and desktop environment, and
runs unattended in GitHub/GitLab CI."""
license = "GPL-3.0-only"
maintainer = "Spatulox"
homepage = "https://github.com/Spatulox/PackagingOnLinux"
categories = ["Development"]

[linux]
# $APP_VERSION (the version above) is stamped into the copied __init__.py.
command = 'rm -rf build/app && mkdir -p build/app && cp -r packagingonlinux build/app/ && find build/app -name __pycache__ -prune -exec rm -rf {} + && sed -i "s/^__version__ = .*/__version__ = \"$APP_VERSION\"/" build/app/packagingonlinux/__init__.py && install -D -m 755 selfpack/linux/launcher build/app/bin/packagingonlinux'
dir = "build/app"
exec = "bin/packagingonlinux"
icon = "selfpack/packagingonlinux.svg"

[windows]
# A Python + Qt app can't be frozen into an .exe from Linux: the release workflow
# (.github/workflows/release.yml) runs PyInstaller on Windows to make this folder,
# then builds the zip and nsis formats from it on Linux.
dir = "build/windows/PackagingOnLinux"
exec = "PackagingOnLinux.exe"
icon = "selfpack/packagingonlinux.ico"

[deps]
# Pure Python: no ELF to scan. PyQt6 is the GUI toolkit packaged by
# distros (PySide6 is used instead when installed, e.g. in a dev venv).
auto = false
deb = ["python3 (>= 3.11)", "python3-pyqt6"]
rpm = ["python3 >= 3.11", "python3-pyqt6"]

[output]
formats = ["deb", "rpm", "tarball"]
dir = "dist"

# The AppImage, Flatpak and Snap don't package build/app (which needs the system's Python
# and PyQt6) but a PyInstaller bundle with Python and Qt included: the release workflow
# builds it, then selfpack/linux/bundled_config.py makes their config from this file.
[flatpak]
# The app runs the host's tools (dpkg-deb, rpmbuild, the user's build command...) through
# flatpak-spawn --host, reads and writes projects in the home folder, and downloads the
# AppImage runtime.
finish_args = ["--share=ipc", "--socket=wayland", "--socket=fallback-x11", "--device=dri", "--share=network", "--filesystem=home", "--talk-name=org.freedesktop.Flatpak"]

[snap]
# Same access as the deb: a strict snap could not run the host's packaging tools.
confinement = "classic"
