[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "compileonlinux"
version = "0.1.0"
description = "Package any prebuilt Linux application as deb, rpm, AppImage, Flatpak, Snap... from one interface"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest>=7", "pytest-qt>=4"]

[project.scripts]
compileonlinux = "compileonlinux.cli:main"

[project.gui-scripts]
compileonlinux-gui = "compileonlinux.gui.app:main"

[tool.setuptools.packages.find]
include = ["compileonlinux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
