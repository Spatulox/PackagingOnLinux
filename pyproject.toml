[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "packagingonlinux"
dynamic = ["version"]
description = "Package any prebuilt Linux application as deb, rpm, AppImage, Flatpak, Snap... from one interface"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest>=7", "pytest-qt>=4"]

[project.scripts]
packagingonlinux = "packagingonlinux.cli:main"

[project.gui-scripts]
packagingonlinux-gui = "packagingonlinux.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "packagingonlinux.__version__" }

[tool.setuptools.packages.find]
include = ["packagingonlinux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
